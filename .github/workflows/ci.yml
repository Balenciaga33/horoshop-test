name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # За потреби перевизначити через repository Variable HOROSHOP_BASE_URL.
  HOROSHOP_BASE_URL: ${{ vars.HOROSHOP_BASE_URL != '' && vars.HOROSHOP_BASE_URL || 'https://shop703343.horoshop.ua' }}

jobs:
  quality:
    name: lint → format → typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  api:
    name: Playwright API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # API project використовує лише request-context — browser binaries не потрібні.

      - name: API tests
        env:
          HOROSHOP_API_LOGIN: ${{ secrets.HOROSHOP_API_LOGIN }}
          HOROSHOP_API_PASSWORD: ${{ secrets.HOROSHOP_API_PASSWORD }}
        run: |
          # PR = smoke @p0; push/manual = повний API suite
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:p0:api
          else
            npm run test:api
          fi

      - name: Upload Playwright report (API)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-api
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  ui:
    name: Playwright UI (headed + xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Fail-fast: не запускати дорогий headed UI, якщо API/auth уже червоний.
    needs:
      - quality
      - api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI tests
        env:
          HOROSHOP_API_LOGIN: ${{ secrets.HOROSHOP_API_LOGIN }}
          HOROSHOP_API_PASSWORD: ${{ secrets.HOROSHOP_API_PASSWORD }}
        run: |
          # Horoshop cart AJAX → BAD_CSRF у headless (KNOWN-ISSUES U1).
          # headless: false у playwright.config; xvfb — віртуальний дисплей на Linux.
          # PR = smoke @p0; push/manual = повний UI suite
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            xvfb-run --auto-servernum npm run test:p0:ui
          else
            xvfb-run --auto-servernum npm run test:ui
          fi

      - name: Upload Playwright report (UI)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-ui
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
