name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Override via repository Variable HOROSHOP_BASE_URL if needed.
  HOROSHOP_BASE_URL: ${{ vars.HOROSHOP_BASE_URL != '' && vars.HOROSHOP_BASE_URL || 'https://shop703343.horoshop.ua' }}

jobs:
  quality:
    name: lint → format → typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  api:
    name: Playwright API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: API tests
        env:
          HOROSHOP_LOGIN: ${{ secrets.HOROSHOP_LOGIN }}
          HOROSHOP_PASSWORD: ${{ secrets.HOROSHOP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:p0:api
          else
            npm run test:api
          fi

      - name: Upload Playwright report (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  ui:
    name: Playwright UI (headed + xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI tests
        env:
          HOROSHOP_LOGIN: ${{ secrets.HOROSHOP_LOGIN }}
          HOROSHOP_PASSWORD: ${{ secrets.HOROSHOP_PASSWORD }}
        run: |
          # Horoshop cart AJAX returns BAD_CSRF under headless Chromium (KNOWN-ISSUES U1).
          # CI runs headed Chrome inside a virtual display.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            xvfb-run --auto-servernum npm run test:p0:ui
          else
            xvfb-run --auto-servernum npm run test:ui
          fi

      - name: Upload Playwright report (UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
